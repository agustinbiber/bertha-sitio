:root{--oliva-osc:#4A5230;--oliva:#70774E;--tinta:#2B3020;--texto:#3E4429;--suave:#5A6040;--salvia:#EDEFE4;--papel:#FAFAF5;--corteza:#9A6331;--linea:#DCDFCF}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px}
body{margin:0;font-family:'Poppins',system-ui,sans-serif;font-size:16px;line-height:1.5;color:var(--tinta);background:var(--papel)}
a{color:var(--oliva-osc)}
:focus-visible{outline:3px solid var(--corteza);outline-offset:2px;border-radius:6px}
header{padding:22px 16px 6px;text-align:center}
header svg{display:block;margin:0 auto}
header p{margin:6px 0 0;color:var(--suave);font-size:13.5px;letter-spacing:.02em}
nav{position:sticky;top:0;z-index:5;background:var(--papel);border-bottom:1px solid var(--linea)}
nav ul{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;list-style:none;margin:0;padding:10px 16px;-webkit-overflow-scrolling:touch}
nav ul::-webkit-scrollbar{display:none}
nav a{display:block;white-space:nowrap;padding:7px 14px;border-radius:99px;border:1px solid var(--linea);background:#fff;color:var(--tinta);text-decoration:none;font-size:14px;font-weight:500}
nav a.on{background:var(--oliva-osc);border-color:var(--oliva-osc);color:#fff}
main{max-width:640px;margin:0 auto;padding:4px 16px 40px}
section{padding-top:22px}
h2{font-size:22px;line-height:1.2;margin:0 0 8px;color:var(--oliva-osc);letter-spacing:-.01em}
ul.items{list-style:none;margin:0;padding:0}
ul.items li{display:flex;align-items:baseline;gap:8px;padding:9px 0;border-bottom:1px solid var(--linea)}
ul.items li span:first-child{flex:1;min-width:0}
ul.items li .puntos{flex:1;border-bottom:1px dotted #c9ccbb;transform:translateY(-4px);min-width:12px}
ul.items li b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
ul.items li.extra{font-size:14px;color:var(--suave);padding:6px 0}
.nota{color:var(--suave);font-size:13px;margin-top:28px;text-align:center}
.cargando{text-align:center;color:var(--suave);padding:40px 0}
footer{text-align:center;padding:20px 16px 34px;font-size:13.5px;color:var(--suave);border-top:1px solid var(--linea)}
</style>

<script>
(function () {
  var NOMBRES = {'Promos y combos': 'Promos', 'Cafetería': 'Café'};
  var fmt = function (n) { return '$ ' + Math.round(n).toLocaleString('es-UY'); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var slug = function (s) { return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-'); };
  var lindo = function (s) { s = s.trim(); return s.charAt(0).toUpperCase() + s.slice(1); };
  fetch('/carta/carta.json', {cache: 'no-cache'}).then(function (r) { return r.json(); }).then(function (d) {
    var main = document.getElementById('carta'), cats = document.getElementById('cats'), h = '', c = '';
    d.secciones.forEach(function (s) {
      var id = slug(s.categoria), titulo = NOMBRES[s.categoria] || s.categoria;
      var ps = s.productos.slice().sort(function (a, b) { return a.nombre.localeCompare(b.nombre, 'es'); });
      var extra = ps.filter(function (p) { return /^adicional/i.test(p.nombre); });
      ps = ps.filter(function (p) { return !/^adicional/i.test(p.nombre); });
      c += '<li><a href="#' + id + '">' + esc(titulo) + '</a></li>';
      h += '<section id="' + id + '"><h2>' + esc(titulo) + '</h2><ul class="items">';
      ps.forEach(function (p) { h += '<li><span>' + esc(lindo(p.nombre)) + '</span><b>' + fmt(p.precio) + '</b></li>'; });
      extra.forEach(function (p) { h += '<li class="extra"><span>' + esc(lindo(p.nombre)) + '</span><b>+ ' + fmt(p.precio) + '</b></li>'; });
      h += '</ul></section>';
    });
    cats.innerHTML = c;
    var f = d.actualizado ? new Date(d.actualizado) : null;
    main.innerHTML = h + '<p class="nota">Precios en pesos uruguayos, IVA incluido' + (f ? ' · actualizados el ' + f.toLocaleDateString('es-UY') : '') + '.</p>';
    var links = Array.prototype.slice.call(cats.querySelectorAll('a'));
    var secs = Array.prototype.slice.call(main.querySelectorAll('section'));
    var marcar = function () {
      var act = secs[0];
      secs.forEach(function (s) { if (s.getBoundingClientRect().top < 140) act = s; });
      links.forEach(function (a) {
        var on = a.getAttribute('href') === '#' + act.id;
        if (on && !a.classList.contains('on')) a.scrollIntoView({block: 'nearest', inline: 'center'});
        a.classList.toggle('on', on);
      });
    };
    window.addEventListener('scroll', marcar, {passive: true}); marcar();
  }).catch(function () {
    document.getElementById('carta').innerHTML = '<p class="cargando">No se pudo cargar la carta. Pedila en el mostrador.</p>';
  });
})();
</script>
